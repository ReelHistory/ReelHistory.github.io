<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read the scanned pages of Reel History by Stephen Farina.">
  <title>Read Reel History · Stephen Farina</title>
  <link rel="stylesheet" href="site.css">
  <script type="module" src="reader.js"></script>
</head>
<body class="reader-body">
  <a class="skip-link" href="#page-viewer">Skip to the book page</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="./">Reel History</a>
      <a class="text-link" href="./">Back to book</a>
    </div>
  </header>

  <main id="reader">
    <h1 class="visually-hidden">Read Reel History</h1>
    <noscript><p class="container">Enable JavaScript to turn pages and save your place. <a href="images/Master%20Copy_img_0.jpg">View the cover scan</a>.</p></noscript>
    <div class="reader-toolbar" id="reader-controls" hidden>
      <div class="container toolbar-inner">
        <div class="page-turns" aria-label="Turn pages" role="group">
          <button class="button button-outline" id="previous" data-page-step="-1" type="button" aria-keyshortcuts="ArrowLeft">Previous</button>
          <button class="button button-outline" id="next" data-page-step="1" type="button" aria-keyshortcuts="ArrowRight">Next</button>
        </div>

        <form class="page-jump" id="page-jump">
          <label for="page-number">Page</label>
          <input id="page-number" type="number" inputmode="numeric" min="1" step="1" required>
          <span id="page-total"></span>
          <button class="button button-outline" type="submit">Go</button>
        </form>

        <div class="reader-actions">
          <button class="button button-outline" id="open-contents" type="button" aria-haspopup="dialog">Contents</button>
          <button class="button button-outline" id="zoom" type="button" aria-pressed="false">Zoom</button>
        </div>
      </div>
      <progress id="reading-progress" aria-label="Reading progress"></progress>
    </div>

    <div class="container reader-inner">
      <div class="scan-scroll" id="page-viewer" tabindex="-1" aria-label="Book page">
        <img id="scan" class="scan" alt="" decoding="async" draggable="false" hidden>
      </div>
      <p class="scan-error" id="scan-error" hidden>This scan couldn’t load. <a class="text-link" id="scan-link">Open the image directly</a>.</p>
      <div class="page-turns-bottom" role="group" aria-label="Turn pages below the scan" hidden>
        <button class="button button-outline" data-page-step="-1" type="button">Previous</button>
        <button class="button button-outline" data-page-step="1" type="button">Next</button>
      </div>
      <div class="reader-caption" id="reader-caption" hidden>
        <p id="page-status" role="status" aria-atomic="true"></p>
        <p class="keyboard-hint">Use the left and right arrow keys to turn pages.</p>
        <p class="swipe-hint">Swipe the scan to turn pages.</p>
      </div>
    </div>
  </main>

  <dialog class="reader-contents" id="reader-contents" aria-labelledby="reader-contents-title">
    <div class="dialog-heading">
      <h2 id="reader-contents-title">Contents</h2>
      <form method="dialog">
        <button class="button button-outline" type="submit" autofocus>Close</button>
      </form>
    </div>
    <p class="front-links">
      <a class="text-link" href="#page1" data-front-page="1">Cover</a>
      <a class="text-link" href="#page5" data-front-page="5">Original contents page</a>
    </p>
    <div id="reader-chapters" class="contents-grid"></div>
  </dialog>
</body>
</html>
